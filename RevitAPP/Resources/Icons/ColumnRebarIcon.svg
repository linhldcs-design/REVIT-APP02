<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>ColumnRebarIcon</title>

  <style>
    .paper{fill:none;stroke:#bde8ec;stroke-width:1.2;stroke-linejoin:round}
    .concrete{fill:none;stroke:#f4fbfc;stroke-width:1.25;stroke-linejoin:round}
    .line,.ink{fill:none;stroke:#f4fbfc;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .ink{stroke:#163642;stroke-width:1.35}
    .grid{fill:none;stroke:#6f939b;stroke-width:1}
    .rebar{fill:none;stroke:#ff5a4e;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .rebar-bold{fill:none;stroke:#ff5a4e;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
    .rebar-loop{fill:none;stroke:#ff5a4e;stroke-width:1.5}
    .stirrup{fill:none;stroke:#2cc7d5;stroke-width:1.1}
    .accent{fill:#ffc857;stroke:none}
    .accent-line{fill:none;stroke:#ffc857;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .cut{fill:none;stroke:#ffc857;stroke-width:1.4;stroke-dasharray:2 1.5}
    .arrow{fill:none;stroke:#ffc857;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .guide{fill:none;stroke:#57c7ff;stroke-width:1.2;stroke-dasharray:2 1}
    .dots{fill:#f4fbfc}.cloud{fill:none;stroke:#57c7ff;stroke-width:1.2;stroke-linejoin:round}
    .search{fill:none;stroke:#ffc857;stroke-width:1.8;stroke-linecap:round}
  </style>


      <rect x="10" y="5" width="12" height="22" rx="1" class="concrete"/>
      <rect x="12" y="7" width="8" height="18" rx="1" class="rebar-loop"/>
      <path d="M14 7v18M18 7v18" class="rebar"/>
      <circle cx="14" cy="9" r="1.2" class="accent"/><circle cx="18" cy="9" r="1.2" class="accent"/>
      <circle cx="14" cy="23" r="1.2" class="accent"/><circle cx="18" cy="23" r="1.2" class="accent"/>

</svg>
